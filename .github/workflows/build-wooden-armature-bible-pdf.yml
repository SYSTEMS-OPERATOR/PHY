name: Build Wooden Armature Bible PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wooden-armature-bible-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab

      - name: Build compiled Markdown Bible
        run: |
          python PROJECTS/bible/build_bible.py

      - name: Build working PDF
        run: |
          python PROJECTS/bible/build_pdf.py

      - name: Preserve rebuilt PDF as v002
        run: |
          python PROJECTS/bible/version_pdf.py \
            --version v002_stateful_footer_svg \
            --note "State-aware footer render with expanded Part II. SVG embedding is optional and can be restored in a later renderer pass." \
            --overwrite

      - name: Commit compiled and versioned PDF artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECTS/reports/WOODEN_ARMATURE_BIBLE.md PROJECTS/reports/WOODEN_ARMATURE_BIBLE.build_report.json PROJECTS/reports/WOODEN_ARMATURE_BIBLE.pdf PROJECTS/reports/WOODEN_ARMATURE_BIBLE.pdf_report.json PROJECTS/reports/pdf_versions
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build and version Wooden Armature Bible PDF v002"
            git push
          fi

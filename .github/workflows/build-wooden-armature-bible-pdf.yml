name: Build Wooden Armature Bible PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wooden-armature-bible-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF and figure dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Export SVG figures to PNG derivatives
        run: |
          python PROJECTS/bible/figures/export_svg_png.py

      - name: Build compiled Markdown Bible
        run: |
          python PROJECTS/bible/build_bible.py

      - name: Build working PDF
        run: |
          python PROJECTS/bible/build_pdf.py

      - name: Preserve rebuilt PDF as v003
        run: |
          python PROJECTS/bible/version_pdf.py \
            --version v003_png_figures \
            --note "PNG figure render pass. SVG masters preserved; PNG derivatives embedded into the PDF when referenced by SVG path." \
            --overwrite

      - name: Commit compiled and versioned PDF artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECTS/bible/figures/*.png PROJECTS/bible/figures/png_export_report.json PROJECTS/reports/WOODEN_ARMATURE_BIBLE.md PROJECTS/reports/WOODEN_ARMATURE_BIBLE.build_report.json PROJECTS/reports/WOODEN_ARMATURE_BIBLE.pdf PROJECTS/reports/WOODEN_ARMATURE_BIBLE.pdf_report.json PROJECTS/reports/pdf_versions
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build and version Wooden Armature Bible PDF v003"
            git push
          fi

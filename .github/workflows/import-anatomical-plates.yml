name: Import Anatomical Plates

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Overwrite existing image files"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  import-anatomical-plates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import all selected anatomical plates
        run: |
          if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
            python PROJECTS/bible/archive/anatomical_plates/import_all_anatomical_plates.py --overwrite
          else
            python PROJECTS/bible/archive/anatomical_plates/import_all_anatomical_plates.py
          fi

      - name: Commit imported anatomical plates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECTS/bible/archive/anatomical_plates
          if git diff --cached --quiet; then
            echo "No new anatomical plate files to commit."
          else
            git commit -m "Import selected anatomical plate images"
            git push
          fi

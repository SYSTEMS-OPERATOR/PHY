name: PHY Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned small reference previews without LFS
        uses: actions/checkout@v4
        with:
          repository: SYSTEMS-OPERATOR/PHY-REF
          ref: 1671f55f7a7cd6f03af4497dd02da02906135795
          path: .phy-reference
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install geometry and test tools
        run: python -m pip install pytest jsonschema cadquery==2.7.0
      - name: Install viewer tools
        run: npm ci --prefix studio
      - name: Build and check viewer
        run: |
          npm run check --prefix studio
          npm run build --prefix studio
          python bin/export_phy_studio.py --reference-root .phy-reference
      - name: Validate bone filtering and actual GLB/STL exports without WebGL
        run: npm run test:logic --prefix studio
      - name: Validate pinned native previews
        env:
          PHY_REF_ROOT: .phy-reference
        run: python -m pytest tests/test_studio_references.py -q
      - name: Validate source, geometry and existing canon
        run: |
          python -m pytest tests/test_relationships.py tests/test_relationship_schema.py tests/test_bone_loading_connections.py tests/test_field_connections.py tests/test_signal_propagation.py -q
          python -m pytest tests/test_studio_evidence.py tests/test_reference_registration.py tests/test_dimension_evidence.py tests/test_craniofacial_audit.py tests/test_facial_source_records.py tests/test_engineering_audit.py tests/test_ear_hyoid_geometry.py tests/test_skull_bone_geometry.py tests/test_fabrication_validation.py tests/test_fabrication_exports.py tests/test_foot_bone_geometry.py tests/test_hand_bone_geometry.py tests/test_bone_equivalence.py tests/test_phy_studio.py tests/test_sophy_geometry_canon.py tests/test_sophy_project_canon_bindings.py tests/test_reference_dimensions.py tests/test_t56_a0_geometry.py tests/test_t56_a0_interfaces.py tests/test_t56_a0_validation.py -q
      - name: Check deterministic export
        run: |
          python bin/export_phy_studio.py --reference-root .phy-reference --output /tmp/phy-repeat
          diff -qr studio/dist /tmp/phy-repeat
          cmp studio/PHY-Studio.html studio/dist/PHY-Studio.html
          diff -qr PROJECTS/PHY_F28/maquette studio/dist/maquette
          cmp PROJECTS/PHY_F28/reports/BONE_EQUIVALENCE.json studio/dist/BONE_EQUIVALENCE.json
          cmp PROJECTS/PHY_F28/reports/BONE_EQUIVALENCE.md studio/dist/BONE_EQUIVALENCE.md
          cmp PROJECTS/PHY_F28/reports/CORE_PROXY_LAYOUT.md studio/dist/CORE_PROXY_LAYOUT.md
          cmp PROJECTS/PHY_F28/reports/HAND_PROXY_LAYOUT.md studio/dist/HAND_PROXY_LAYOUT.md
          cmp PROJECTS/PHY_F28/reports/FOOT_PROXY_LAYOUT.md studio/dist/FOOT_PROXY_LAYOUT.md
          cmp PROJECTS/PHY_F28/reports/SKULL_PROXY_LAYOUT.md studio/dist/SKULL_PROXY_LAYOUT.md
          cmp PROJECTS/PHY_F28/reports/EAR_HYOID_PROXY_LAYOUT.md studio/dist/EAR_HYOID_PROXY_LAYOUT.md
      - name: Check deterministic A0 cartridge manufacturing export
        run: |
          python bin/export_t56_a0_article.py --output /tmp/a0-first
          python bin/export_t56_a0_article.py --output /tmp/a0-repeat
          diff -qr /tmp/a0-first /tmp/a0-repeat
      - name: Install test browser
        working-directory: studio
        run: npx playwright install --with-deps chromium
      - name: Acquire exact original for explicit local-file browser fixtures
        run: python .phy-reference/tools/acquire_nih.py --asset NIH_3DPX_020984
      - name: Exercise offline Studio and exports
        env:
          PHY_PELVIS_ORIGINAL: .phy-reference/assets/nih/originals/VH_F_Pelvis.glb
        run: npm run test:browser --prefix studio
      - name: Independently reconstruct browser original reviews and packet
        run: |
          python .phy-reference/tools/validate_original_review.py --original .phy-reference/assets/nih/originals/VH_F_Pelvis.glb --draft /tmp/phy-original-review-qa/review-A.json --compare /tmp/phy-original-review-qa/review-B.json
          python .phy-reference/tools/validate_original_review.py --original .phy-reference/assets/nih/originals/VH_F_Pelvis.glb --packet /tmp/phy-original-review-qa/packet.json
      - uses: actions/upload-artifact@v4
        with:
          name: phy-studio-demo
          path: |
            studio/dist/PHY-Studio-package.zip
            /tmp/phy-studio-qa/
            /tmp/phy-relationships-qa/
            /tmp/phy-original-review-qa/
